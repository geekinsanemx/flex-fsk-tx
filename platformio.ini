[platformio]
src_dir = .

[env]
; Official PlatformIO espressif32 platform tops out at arduino-esp32 core 2.0.17 (ESP-IDF 4.4),
; which lacks the ESP-IDF 5.x watchdog API (esp_task_wdt_config_t) this codebase uses and that
; arduino-cli's esp32:esp32 3.1.3 core already provides. pioarduino's platform-espressif32 fork
; is the standard source for arduino-esp32 3.x support under PlatformIO.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<host/>
    -<bkp/>
    -<scripts/>
    -<docs/>
    -<.pio/>
    -<include/tinyflex/demos/>
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
    bblanchon/ArduinoJson
    knolleary/PubSubClient

; =============================================================================
; TTGO LoRa32-OLED v2.1
; =============================================================================

[env:ttgo-wifi]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -D TTGO_LORA32_V21

[env:ttgo-wifi-all]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -D TTGO_LORA32_V21 -D ENABLE_RTC -D ENABLE_IMAP -D ENABLE_CHATGPT
lib_deps =
    ${env.lib_deps}
    adafruit/RTClib
    mobizt/ReadyMail

[env:ttgo-gsm]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -D TTGO_LORA32_V21 -D ENABLE_GSM
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM
    openslab-osu/SSLClient

[env:ttgo-gsm-rtc]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -D TTGO_LORA32_V21 -D ENABLE_GSM -D ENABLE_RTC
lib_deps =
    ${env.lib_deps}
    adafruit/RTClib
    vshymanskyy/TinyGSM
    openslab-osu/SSLClient

[env:ttgo-full]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -D TTGO_LORA32_V21 -D ENABLE_RTC -D ENABLE_IMAP -D ENABLE_CHATGPT -D ENABLE_GSM
lib_deps =
    ${env.lib_deps}
    adafruit/RTClib
    mobizt/ReadyMail
    vshymanskyy/TinyGSM
    openslab-osu/SSLClient

; =============================================================================
; Heltec WiFi LoRa 32 V2
